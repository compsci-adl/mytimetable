name: Update Changelog and Version

on:
  push:
    branches:
      - main

jobs:
  update-changelog:
    name: Auto Changelog & Version Bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if already run
        id: check_run
        run: |
          commit_message=$(git log -n 1 --format="%B")
          pr_number=$(echo "$commit_message" | grep -oE '\(#[0-9]+\)' | head -n 1 | tr -d '(#)')
          
          if [ -n "$pr_number" ] && [ -f CHANGELOG.md ] && (grep -q "/pull/$pr_number" CHANGELOG.md || grep -q "(#$pr_number)" CHANGELOG.md); then
            echo "Changelog already contains entries for PR #$pr_number. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Changelog does not contain entries for PR #$pr_number. Proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run update script
        if: steps.check_run.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec tsx scripts/update-changelog-ci.ts

      - name: Commit and Push changes
        if: steps.check_run.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update CHANGELOG.md and bump version"
            git push origin HEAD:${{ github.ref }}
          fi